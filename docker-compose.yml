version: '3.8'

services:
  extended-war:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extended-war
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # Mount config directory for runtime configuration
      - ./config:/app/config:ro
      # Optional: Mount scripts if needed at runtime
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    networks:
      - extended-war-network

  # Development service with hot reload
  extended-war-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: extended-war-dev
    ports:
      - "5005:5004"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      # Use named volume for node_modules to avoid conflicts
      - node_modules:/app/node_modules
    command: pnpm run dev
    restart: unless-stopped
    networks:
      - extended-war-network

networks:
  extended-war-network:
    driver: bridge

volumes:
  node_modules:
